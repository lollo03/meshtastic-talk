name: Build & Export

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slidev-template

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: slidev-template/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Replace sourceCode URL
        run: |
          sed -i "s|^sourceCode:.*|sourceCode: ${{ github.server_url }}/${{ github.repository }}|" ./slides.md

      - name: Build web bundle
        run: npx slidev build --base /${{ github.event.repository.name }}/ --download

      - name: Install Playwright for PDF export
        run: |
          npm i -D playwright-chromium
          npx playwright install chromium --with-deps

      - name: Export PDF
        run: npx slidev export

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: slidev-template/dist/

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides.pdf
          path: slidev-template/slides.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: slidev-template/dist/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
